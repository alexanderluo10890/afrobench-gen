# Models the harness can evaluate, pinned to exact revisions.
# Every model uses the SAME benchmark settings (prompts, decoding, extraction: configs/ + tasklib).
#
# language_model_only: vLLM flag for multimodal checkpoints (skip the vision tower).
# tokenizer_fix: tokenizer_json = load the tokenizer from the repo's tokenizer.json as
#   PreTrainedTokenizerFast. Needed for tiny-aya under transformers v5, which loads
#   CohereTokenizer with hard-coded per-digit splitting (transformers issue #49176).
#   Every model's tokenizer is checked against its tokenizer.json before a run (afbgen.models).
# card: per-benchmark numbers on the AfriqueQwen3.5-4B-Instruct-v2 model card (targets).

