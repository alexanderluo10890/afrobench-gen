# How each benchmark is split into GPU jobs (one L40S each, <= 3 h; jobs requeue and resume).
# AfriMGSM: 16 samples x 250 questions per language, split into `parts_per_language` jobs.
afrimgsm: {parts_per_language: 2}  # 18 languages x 2 = 36 jobs
afrimmlu: {languages_per_job: 6}   # 18 -> 3 jobs
afrixnli: {languages_per_job: 6}   # 18 -> 3 jobs
belebele: {languages_per_job: 5}   # 25 -> 5 jobs
injongo:  {languages_per_job: 9}   # 17 -> 2 jobs
sib:      {languages_per_job: 13}  # 26 -> 2 jobs
flores:   {languages_per_job: 8}   # 48 directions -> 6 jobs
